<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4F3EB">
<meta name="description" content="Fonaments de nutrició òptimament saludable: macro-nutrients, micro-nutrients, anti-nutrients i recomanacions.">
<title>Fonaments de nutrició òptimament saludable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17302B;--mute:#4F655E;--line:#D3E2DB;--brand:#0E7C66;--brand-d:#0A5E4D;
--l1:#12A38A;--l2:#F0A030;--l3:#EE6C5B;--l4:#7A6AE6;--h1:#0B5D52;--h2:#3A4BB0;--h3:#8A3A86;
--top:60px;--mp:8px;--wrap:860px;--cl:calc(var(--mp) + 8px);--cr:calc(var(--mp) + 8px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--top) + 12px);-webkit-text-size-adjust:100%;font-size:15px}
body{margin:0;min-height:100vh;color:var(--ink);background:#E4F3EB;overflow-wrap:break-word;
font:1rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(60rem 40rem at 100% -10%,#FFE6D2 0,transparent 60%),
radial-gradient(50rem 40rem at -10% 110%,#E3DFFA 0,transparent 60%),linear-gradient(160deg,#E4F3EB,#D6EBE8)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #E58A00;outline-offset:2px}
.top{position:sticky;top:0;z-index:30;height:var(--top);background:rgba(228,243,235,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);transition:transform .25s ease}
.top.hide{transform:translateY(-100%)}
.top-in{height:100%;max-width:var(--wrap);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.menu{grid-column:1;justify-self:start}
.name{grid-column:2;min-width:0;min-height:44px;padding:0 2px;border:0;background:none;text-align:center;cursor:pointer;
font:700 clamp(.8rem,3.7vw,1.05rem)/1.15 "Bricolage Grotesque",system-ui,sans-serif;-webkit-hyphens:manual;hyphens:manual}
#tgl{grid-column:3;justify-self:end}
.btn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;
border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:.95rem}
.btn:hover{border-color:var(--brand)}
.btn.ic{width:44px;padding:0}
#tgl[data-s=open] .i-e,#tgl[data-s=closed] .i-c{display:none}
.layout{display:block}
.drawer{position:fixed;z-index:50;inset:0 auto 0 0;width:min(88vw,330px);display:flex;flex-direction:column;background:#fff;
transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(10,40,30,.25)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,30,24,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.dh{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);
font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif}
.toc-wrap{flex:1;min-height:0;overflow:auto;padding:8px 10px 24px;overscroll-behavior:contain}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;color:inherit;text-decoration:none;font-size:.9rem;line-height:1.35}
.toc a:hover{background:#EEF6F2}
.toc a[aria-current=true]{background:#DDF0E8;box-shadow:inset 3px 0 0 var(--brand)}
.toc .nt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-width:0}
.toc .n1{margin-top:8px}.toc .n1>a{font-weight:700;color:var(--h1);font-size:.95rem}
.toc .n2>a{padding-left:30px;color:var(--h2);font-weight:600}
.toc .n3>a{padding-left:48px;color:var(--h3);font-size:.86rem}
.nemo{flex:none;line-height:1.35}.nemo.multi{display:grid;grid-template-columns:repeat(2,auto);font-size:.7rem;line-height:1.15}
main{max-width:var(--wrap);margin:0 auto;padding:10px var(--mp) 64px}
.hero{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sec{margin:0 0 10px;background:#fff;border:1px solid var(--line);border-radius:16px;
box-shadow:0 10px 30px -18px rgba(14,80,64,.4);scroll-margin-top:calc(var(--top) + 12px)}
.sec>summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;list-style:none;cursor:pointer;border-radius:16px}
.sec>summary::-webkit-details-marker{display:none}
.sec[open]>summary{border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.emo{flex:none;font-size:1.45rem;line-height:1}
.emo.multi{display:grid;grid-template-columns:repeat(2,auto);gap:0 1px;font-size:.95rem;line-height:1.2}
.multi i{font-style:normal}
.multi .ico svg{display:block;width:1.1em;height:1.1em}
.ttl{flex:1;color:var(--h1);font:700 clamp(1rem,4.1vw,1.3rem)/1.25 "Bricolage Grotesque",system-ui,sans-serif;-webkit-hyphens:manual;hyphens:manual}
.chev{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#E6F3EE}
.chev::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--brand-d);border-bottom:2.5px solid var(--brand-d);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.sec[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.sec-body{padding:4px 12px 16px}
.sec-body p{margin:.6rem 0;text-align:justify;text-justify:inter-word;word-spacing:-.05em}
.sec-body p.dash{padding-left:1rem;text-indent:-1rem}
.hd{margin:1.6rem 0 .6rem;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;line-height:1.3;-webkit-hyphens:manual;hyphens:manual}
.sec-body>.hd:first-child{margin-top:.9rem}
.hd2{--c:var(--h2);font-size:1.12rem;scroll-margin-top:calc(var(--top) + 42px)}
.hd3{--c:var(--h3);font-size:1.02rem;margin-top:1.3rem;scroll-margin-top:calc(var(--top) + 72px)}
.ht{color:var(--c);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--c) 50%,transparent)}
.hd .emo{display:inline-block;vertical-align:middle;margin:0 .5em 0 0;font-size:1.25em}
.hd .emo.multi{display:inline-grid;font-size:.8em}
.lv,.lv ul{list-style:none;margin:.5rem 0;padding:0}
.lv1{--c:var(--l1)}.lv2{--c:var(--l2);--pc:var(--l1)}.lv3{--c:var(--l3);--pc:var(--l2)}.lv4{--c:var(--l4);--pc:var(--l3)}
.lv2,.lv3,.lv4{margin:.3rem 0 .5rem -11px;padding-left:8px;border-left:2px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.lv>li{position:relative;margin:.5rem 0;padding-left:16px}
.lv>li::before{content:"";position:absolute;left:0;top:.45em;width:10px;height:10px;border-radius:3px;background:var(--c)}
.lv2>li::before{width:9px;height:9px;top:.48em}.lv3>li::before{width:8px;height:8px;top:.5em}.lv4>li::before{width:7px;height:7px;top:.53em}
.lv>li>p{margin:.2rem 0}
.t-g{color:#1F6B2C}.t-r{color:#A3201B}.t-b{color:#1B4F9C}
mark{padding:0 .15em;border-radius:3px;background:#FFE48A;color:inherit}
.chip{display:inline-block;min-width:2.3em;margin-right:.5em;padding:0 .6em;border-radius:99px;text-align:center;font-size:.82rem;font-weight:700;line-height:1.5}
.v-no .chip{background:#FBE1DE;color:#8E1B16}.v-yes .chip{background:#D9F0DF;color:#17622A}
.crumbs{position:fixed;z-index:25;top:var(--top);left:0;right:0;display:none;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
border-bottom:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(14,80,64,.45);transition:transform .25s ease}
.crumbs.on{display:block}
body.nobar .crumbs{transform:translateY(calc(var(--top) * -1))}
.cr{display:flex;align-items:center;gap:8px;height:30px;max-width:var(--wrap);margin:0 auto;padding:0 var(--cr) 0 var(--cl);cursor:pointer;
font:700 .82rem/1 "Bricolage Grotesque",system-ui,sans-serif}
.cr[hidden]{display:none}
.cr1{color:var(--h1)}.cr2{color:var(--h2);padding-left:calc(var(--cl) + 14px)}.cr3{color:var(--h3);padding-left:calc(var(--cl) + 28px)}
.cr .e{flex:none}.cr .emo{font-size:1rem;line-height:1}.cr .emo.multi{display:inline-flex;align-items:center;gap:1px;font-size:.8rem}.cr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .u{flex:none;width:8px;height:8px;border-left:2px solid var(--mute);border-top:2px solid var(--mute);transform:translateY(2px) rotate(45deg)}
@media(min-width:768px){:root{--mp:24px}html{font-size:16px}.sec>summary{padding:14px 18px;min-height:64px}.sec-body{padding:6px 20px 20px}}
@media(min-width:1024px){
:root{--wrap:1180px;--cl:14px;--cr:14px;--top:72px}
.crumbs{left:max(340px,calc(50% - var(--wrap)/2 + 340px));right:max(16px,calc(50% - var(--wrap)/2 + 16px));border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}
.cr{max-width:none}
.name{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.top-in{padding:0 16px}
.layout{max-width:var(--wrap);margin:0 auto;padding:0 16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.drawer{position:sticky;top:calc(var(--top) + 16px);z-index:1;width:auto;height:calc(100vh - var(--top) - 32px);margin:16px 0;transform:none;
border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px -18px rgba(14,80,64,.4)}
.scrim,.menu,.dclose{display:none}
main{max-width:none;margin:0;padding:16px 0 90px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
<button class="btn menu" id="menu" aria-controls="drawer" aria-expanded="false"><span aria-hidden="true">☰</span> Índex</button>
<button class="name" id="name" type="button" aria-label="Torna a dalt de tot"><span>Fonaments de nutrició</span><span class="nl"> òptimament saludable</span></button>
<button class="btn ic" id="tgl" type="button" data-s="open" aria-label="Plega-ho tot" title="Plega-ho tot">
<svg class="i-c" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5 5-5M7 20l5-5 5 5"/></svg>
<svg class="i-e" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>
</button>
</div></header>
<div class="crumbs" id="crumbs" aria-hidden="true"><div class="cr cr1" hidden></div><div class="cr cr2" hidden></div><div class="cr cr3" hidden></div></div>
<div class="layout">
<aside class="drawer" id="drawer" aria-label="Índex">
<div class="dh"><span>Índex</span><button class="btn dclose" id="dclose" aria-label="Tanca l'índex">✕</button></div>
<div class="toc-wrap"><nav aria-label="Apartats"><ol class="toc" id="toc-list"></ol></nav></div>
</aside>
<main id="content"></main>
</div>
<div class="scrim" id="scrim"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
<script>
(async()=>{
const mount=document.querySelector('#content');
const response=await fetch('./content.md');
if(!response.ok)throw new Error('Could not load page content');
const source=await response.text();
const template=document.createElement('template');
template.innerHTML=marked.parse(source,{gfm:true});
let section=null,body=null,sectionNo=0,subNo=0;
const splitIcon=value=>{
 const m=value.match(/^((?:\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?)*\s*)+)/u);
 return m?[m[1].trim(),value.slice(m[0].length).trim()]:['',value.trim()];
};
for(const node of [...template.content.childNodes]){
 if(node.nodeType===3&&!node.textContent.trim())continue;
 if(node.nodeType===1&&node.tagName==='H1'){
  sectionNo++;subNo=0;const [icon,title]=splitIcon(node.textContent);
  section=document.createElement('details');section.className='sec';section.id='sec-'+sectionNo;section.open=true;
  const summary=document.createElement('summary');summary.dataset.h='1';
  const emo=document.createElement('span');emo.className='emo';emo.setAttribute('aria-hidden','true');emo.textContent=icon;summary.append(emo);
  const ttl=document.createElement('span');ttl.className='ttl';ttl.textContent=title;summary.append(ttl);
  const chev=document.createElement('span');chev.className='chev';chev.setAttribute('aria-hidden','true');summary.append(chev);
  body=document.createElement('div');body.className='sec-body';section.append(summary,body);mount.append(section);
 }else if(section&&node.nodeType===1){
  if(node.tagName==='H2'||node.tagName==='H3'){
   const level=node.tagName==='H2'?2:3;subNo++;const [icon,title]=splitIcon(node.textContent);
   const heading=document.createElement(level===2?'h3':'h4');heading.className='hd '+(level===2?'hd2':'hd3');heading.id='h-'+subNo;heading.dataset.h=String(level);
   if(icon){const e=document.createElement('span');e.className='emo';e.setAttribute('aria-hidden','true');e.textContent=icon;heading.append(e)}
   const t=document.createElement('span');t.className='ht';t.innerHTML=marked.parseInline(title);heading.append(t);body.append(heading);
  }else body.append(node);
 }else if(section&&node.nodeType===8)body.append(node);
}
const decorate=(parent,depth=1)=>{
 let pending=null;
 for(const n of [...parent.childNodes]){
  if(n.nodeType===8){const marker=n.data.trim();if(marker.startsWith('nutrition-list:'))pending=marker.split(':')[1].trim();else if(marker==='nutrition-dash')pending='dash';continue}
  if(n.nodeType!==1)continue;
  if(n.tagName==='UL'){n.classList.add('lv','lv'+Math.min(depth,4));if(pending==='v-no'||pending==='v-yes')n.classList.add(pending);pending=null;decorate(n,depth+1);continue}
  if(pending==='dash'&&n.tagName==='P'){n.classList.add('dash');pending=null}
  decorate(n,depth);
 }
};
decorate(mount);
const toc=document.querySelector('#toc-list');
for(const h of mount.querySelectorAll('[data-h]')){
 const level=Number(h.dataset.h),target=h.id||h.closest('details')?.id;
 const title=(level===1?h.querySelector('.ttl'):h.querySelector('.ht'))?.textContent?.trim();
 if(!target||!title)continue;
 const li=document.createElement('li');li.className='n'+level;const link=document.createElement('a');link.href='#'+target;
 const icon=h.querySelector('.emo');if(icon){const copy=icon.cloneNode(true);copy.classList.add('nemo');link.append(copy)}
 const text=document.createElement('span');text.className='nt';text.textContent=title;link.append(text);li.append(link);toc.append(li);
}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const drawer=$('#drawer'),scrim=$('#scrim'),menu=$('#menu'),tgl=$('#tgl'),topbar=$('.top'),crumbs=$('#crumbs'),rows=$$('.cr',crumbs),
mq=matchMedia('(min-width:1024px)'),secs=$$('details.sec'),heads=$$('[data-h]');
const lvl=h=>+h.dataset.h,secOf=h=>h.closest('details'),keyOf=h=>h.id||secOf(h).id;
const sync=()=>{drawer.inert=!mq.matches&&!drawer.classList.contains('open')};
function setDrawer(on){drawer.classList.toggle('open',on);scrim.classList.toggle('on',on);menu.setAttribute('aria-expanded',on);sync();if(on)$('a',drawer).focus()}
mq.addEventListener('change',()=>setDrawer(false));sync();
menu.onclick=()=>setDrawer(true);scrim.onclick=()=>setDrawer(false);
$('#dclose').onclick=()=>{setDrawer(false);showBar();menu.focus({preventScroll:true})};
addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open')){setDrawer(false);showBar();menu.focus({preventScroll:true})}});
function reveal(id,go){const t=document.getElementById(id);if(!t)return;for(let n=t;n;n=n.parentElement)if(n.tagName==='DETAILS')n.open=true;if(go)t.scrollIntoView()}
const links=new Map($$('.toc a').map(a=>[a.getAttribute('href').slice(1),a]));
links.forEach((a,id)=>a.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'','#'+id);reveal(id,true);setDrawer(false)}));
$('#name').onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
function tstate(){const o=secs.some(d=>d.open),t=o?'Plega-ho tot':'Desplega-ho tot';tgl.dataset.s=o?'open':'closed';tgl.setAttribute('aria-label',t);tgl.title=t}
tgl.onclick=()=>{const o=secs.some(d=>d.open);secs.forEach(d=>d.open=!o);tstate()};
let ly=scrollY,tick=0;
function showBar(){topbar.classList.remove('hide');document.body.classList.remove('nobar');ly=scrollY}
function barSync(){const y=scrollY,dy=y-ly;if(Math.abs(dy)<8&&y>80)return;ly=y;
const hide=!mq.matches&&y>80&&dy>0;topbar.classList.toggle('hide',hide);document.body.classList.toggle('nobar',hide)}
topbar.addEventListener('focusin',showBar);
const mk=(c,t)=>{const x=document.createElement('span');x.className=c;if(t)x.textContent=t;return x};
const textOf=h=>(lvl(h)===1?$('.ttl',h):$('.ht',h)).textContent;
function spy(){tick=0;const T=topbar.offsetHeight;let st=[],rs=[];
for(const h of heads){if(lvl(h)>1&&!secOf(h).open)continue;const r=h.getBoundingClientRect();if(r.top>T+80)break;
rs=rs.filter(x=>lvl(x)<lvl(h));rs.push(h);st=st.filter(x=>lvl(x)<lvl(h));if(r.bottom<=T+8)st.push(h)}
if(st[0]&&lvl(st[0])===1&&!secOf(st[0]).open)st=[];
const cur=rs.length?keyOf(rs[rs.length-1]):null;
links.forEach((a,id)=>id===cur?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));
rows.forEach((row,i)=>{const h=st[i];row.hidden=!h;if(h&&row._h!==h){row._h=h;const e=$('.emo',h);row.replaceChildren(e?e.cloneNode(true):mk('e'),mk('t',textOf(h)),mk('u'))}});
crumbs.classList.toggle('on',st.length>0);

barSync()}
addEventListener('scroll',()=>{if(!tick)tick=requestAnimationFrame(spy)},{passive:true});addEventListener('resize',spy);
secs.forEach(d=>d.addEventListener('toggle',()=>{tstate();spy()}));
crumbs.addEventListener('click',e=>{const r=e.target.closest('.cr'),h=r&&r._h;if(!h)return;
if(lvl(h)===1){const d=secOf(h);d.open=false;if(d.getBoundingClientRect().top<70)d.scrollIntoView()}else h.scrollIntoView()});
let sx=0,sy=0,tr=false;
addEventListener('touchstart',e=>{tr=!mq.matches&&e.touches.length===1;if(tr){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
addEventListener('touchcancel',()=>{tr=false},{passive:true});
addEventListener('touchend',e=>{if(!tr)return;tr=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.8)return;
const open=drawer.classList.contains('open');if(!open&&dx>0)setDrawer(true);else if(open&&dx<0)setDrawer(false)},{passive:true});
tstate();spy();
if(location.hash)reveal(location.hash.slice(1),true);
addEventListener('hashchange',()=>reveal(location.hash.slice(1),true));
})().catch(error=>{console.error(error);document.querySelector('#content').textContent='No s’ha pogut carregar el contingut.'});
</script>
</body>
</html>
