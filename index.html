const par=b=>{const chip=b.kind==='yes'?'y':b.kind==='no'?'n':'',ti=reg({ca:b.ca||'',es:b.es,en:b.en,rich:1,chip}),cls=chip?`v v-${chip==='y'?'yes':'no'}`:b.kind==='dash'?'dash':'';return `<p${cls?` class="${cls}"`:''} data-i="${ti}"></p>`};
for(const b of blocks){let r=+b.depth||0;
if(b.kind==='h2'||b.kind==='h3'){while(st.length)close();out.push(hd(b))}
else if(b.kind==='li'){r=Math.max(r,1);while(st.length&&st[st.length-1].raw>r)close();let t;if(st.length&&st[st.length-1].raw===r){t=st[st.length-1];t.done.push('<li>'+t.cur.join('')+'</li>')}else{t={raw:r,done:[],cur:null};st.push(t)}t.cur=[par(b)]}
else if(r===0){while(st.length)close();out.push(par(b))}
else{while(st.length&&st[st.length-1].raw>r)close();(st.length?st[st.length-1].cur:out).push(par(b))}}
while(st.length)close();return out.join('')}
function build(data){T=[];hc=0;const nav=[],main=[];
data.sections.forEach((s,i)=>{const n=i+1,ti=reg({ca:s.title_ca||'',es:s.title_es,en:s.title_en,pre:n+'. '});
nav.push(`<li class="n1"><a href="#sec-${n}">${emo(s.icon,'nemo')}<span class="nt" data-i="${ti}"></span></a></li>`);
const body=renderBlocks(s.blocks||[],nav);
main.push(`<details class="sec" id="sec-${n}"><summary data-h="1">${emo(s.icon,'emo')}<span class="ttl" data-i="${ti}"></span><span class="chev" aria-hidden="true"></span></summary><div class="sec-body">${body}</div></details>`)});
$('#toc').innerHTML=nav.join('');$('main').insertAdjacentHTML('beforeend',main.join(''))}
async function boot(){let data;try{const r=await fetch('content/content.json',{cache:'no-cache'});if(!r.ok)throw 0;data=await r.json()}catch(e){$('main').insertAdjacentHTML('beforeend','<p style="padding:1rem">Could not load the content.</p>');return}
build(data);start()}
function start(){
const drawer=$('#drawer'),scrim=$('#scrim'),menu=$('#menu'),tgl=$('#tgl'),topbar=$('.top'),crumbs=$('#crumbs'),rows=$$('.cr',crumbs),
mq=matchMedia('(min-width:1024px)'),secs=$$('details.sec'),heads=$$('[data-h]');
const lvl=h=>+h.dataset.h,secOf=h=>h.closest('details'),keyOf=h=>h.id||secOf(h).id;
const sync=()=>{drawer.inert=!mq.matches&&!drawer.classList.contains('open')};
function setDrawer(on){drawer.classList.toggle('open',on);scrim.classList.toggle('on',on);menu.setAttribute('aria-expanded',on);sync();if(on)$('a',drawer).focus()}
mq.addEventListener('change',()=>setDrawer(false));sync();
menu.onclick=()=>setDrawer(true);scrim.onclick=()=>setDrawer(false);
$('#dclose').onclick=()=>{setDrawer(false);showBar();menu.focus({preventScroll:true})};
addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open')){setDrawer(false);showBar();menu.focus({preventScroll:true})}});
function reveal(id,go){const t=document.getElementById(id);if(!t)return;for(let n=t;n;n=n.parentElement)if(n.tagName==='DETAILS')n.open=true;if(go)t.scrollIntoView()}
const links=new Map($$('.toc a').map(a=>[a.getAttribute('href').slice(1),a]));
links.forEach((a,id)=>a.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'','#'+id);reveal(id,true);setDrawer(false)}));
$('#name').onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
function tstate(){const o=secs.some(d=>d.open),t=UI[lang][o?'fold':'unfold'];tgl.dataset.s=o?'open':'closed';tgl.setAttribute('aria-label',t);tgl.title=t}
tgl.onclick=()=>{const o=secs.some(d=>d.open);secs.forEach(d=>d.open=!o);tstate()};
const root=document.documentElement,LANGS=['ca','es','en'],D=JSON.parse($('#i18n').textContent),UI=D._ui;let lang='ca',HC=60,HB=96;
function readVars(){const cs=getComputedStyle(root);HC=parseFloat(cs.getPropertyValue('--top'))||60;HB=parseFloat(cs.getPropertyValue('--hb'))||96}
function head(){const y=Math.max(0,scrollY),p=HB>HC?Math.min(1,Math.max(0,(HB-HC-y)/(HB-HC))):0;root.style.setProperty('--p',p.toFixed(3));root.style.setProperty('--hh',(HC+(HB-HC)*p).toFixed(1)+'px')}
let ly=scrollY,tick=0;
function showBar(){topbar.classList.remove('hide');document.body.classList.remove('nobar');ly=scrollY}
function barSync(){const y=scrollY,dy=y-ly;if(Math.abs(dy)<8&&y>80)return;ly=y;
const hide=!mq.matches&&y>80&&dy>0;topbar.classList.toggle('hide',hide);document.body.classList.toggle('nobar',hide)}
topbar.addEventListener('focusin',showBar);
const mk=(c,t)=>{const x=document.createElement('span');x.className=c;if(t)x.textContent=t;return x};
const textOf=h=>(lvl(h)===1?$('.ttl',h):$('.ht',h)).textContent;
function spy(){tick=0;head();const T=topbar.offsetHeight;let st=[],rs=[];
for(const h of heads){if(lvl(h)>1&&!secOf(h).open)continue;const r=h.getBoundingClientRect();if(r.top>T+80)break;
rs=rs.filter(x=>lvl(x)<lvl(h));rs.push(h);st=st.filter(x=>lvl(x)<lvl(h));if(r.bottom<=T+8)st.push(h)}
if(st[0]&&lvl(st[0])===1&&!secOf(st[0]).open)st=[];
const cur=rs.length?keyOf(rs[rs.length-1]):null;
links.forEach((a,id)=>id===cur?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));
rows.forEach((row,i)=>{const h=st[i];row.hidden=!h;if(h&&row._h!==h){row._h=h;const e=$('.emo',h);row.replaceChildren(...(e?[e.cloneNode(true)]:[]),mk('t',textOf(h)),mk('u'))}});
crumbs.classList.toggle('on',st.length>0);

barSync()}
addEventListener('scroll',()=>{if(!tick)tick=requestAnimationFrame(spy);clearTimeout(svT);svT=setTimeout(saveState,150)},{passive:true});addEventListener('resize',()=>{readVars();spy()});
secs.forEach(d=>d.addEventListener('toggle',()=>{tstate();spy();saveState()}));
crumbs.addEventListener('click',e=>{const r=e.target.closest('.cr'),h=r&&r._h;if(!h)return;
if(lvl(h)===1){const d=secOf(h);d.open=false;if(d.getBoundingClientRect().top<70)d.scrollIntoView()}else h.scrollIntoView()});
let sx=0,sy=0,tr=false;
addEventListener('touchstart',e=>{tr=!mq.matches&&e.touches.length===1;if(tr){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
addEventListener('touchcancel',()=>{tr=false},{passive:true});
addEventListener('touchend',e=>{if(!tr)return;tr=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.8)return;
const open=drawer.classList.contains('open');if(!open&&dx>0)setDrawer(true);else if(open&&dx<0)setDrawer(false)},{passive:true});
function pick(){try{const s=localStorage.getItem('lang');if(LANGS.includes(s))return s}catch(e){}
for(const x of(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||''])){const c=x.slice(0,2).toLowerCase();if(LANGS.includes(c))return c}return 'en'}
function applyLang(l,save){lang=l;root.lang=l;const u=UI[l];
$$('[data-i]').forEach(el=>fill(el,l,u));
$$('[data-ui]').forEach(e=>e.textContent=u[e.dataset.ui]);$$('[data-ui-label]').forEach(e=>e.setAttribute('aria-label',u[e.dataset.uiLabel]));
$$('.chip').forEach(c=>c.textContent=c.dataset.c==='y'?u.yes:u.no);document.title=u.title;root.style.setProperty('--ch',(u.title.length*0.62).toFixed(2));$('meta[name=description]').content=u.desc;
$$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===l)));rows.forEach(r=>{r._h=null});tstate();spy();
if(save)try{localStorage.setItem('lang',l)}catch(e){}}
$$('.lang button').forEach(b=>b.onclick=()=>applyLang(b.dataset.l,true));
const SS='ui-state';let svT,st=null;
try{st=JSON.parse(sessionStorage.getItem(SS)||'null')}catch(e){}
function saveState(){try{sessionStorage.setItem(SS,JSON.stringify({y:Math.round(scrollY),o:secs.filter(d=>d.open).map(d=>d.id)}))}catch(e){}}
addEventListener('pagehide',saveState);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()});
if('scrollRestoration' in history)history.scrollRestoration='manual';
if(st&&Array.isArray(st.o))secs.forEach(d=>{d.open=st.o.includes(d.id)});
readVars();applyLang(pick());
if(st&&typeof st.y==='number'){let touched=false;['wheel','touchstart','keydown','mousedown'].forEach(e=>addEventListener(e,()=>{touched=true},{once:true,passive:true}));
const go=()=>{if(touched)return;root.style.scrollBehavior='auto';scrollTo(0,st.y);root.style.scrollBehavior=''};
go();addEventListener('load',go,{once:true});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go)}
else if(location.hash)reveal(location.hash.slice(1),true);
addEventListener('hashchange',()=>reveal(location.hash.slice(1),true));
}
boot();
</script>
